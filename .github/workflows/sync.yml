name: Sincronizar iCal

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-ical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_KEY: ${{ secrets.API_KEY }}
      BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
      BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar calendarios (Booking, Airbnb)
        run: node sync.js
      - name: Publicar calendario de reservas directas
        if: ${{ !cancelled() }}
        run: node export.js
      - name: Guardar cambios del calendario
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ecos-sync"
          git config user.email "ecos-sync@users.noreply.github.com"
          # Marca semanal: evita que GitHub pause el flujo por inactividad (repositorios públicos)
          mkdir -p docs && date -u +%G-W%V > docs/semana.txt
          git add docs/directas.ics docs/semana.txt
          if git diff --cached --quiet; then echo "Sin cambios en el calendario"; else git commit -m "Actualizar calendario de reservas directas" && git push; fi
